```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماما نوير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FBF3E6;
    --cream-deep: #F3E3C7;
    --brown: #5A3A22;
    --brown-soft: #7A5236;
    --gold: #C8912E;
    --gold-deep: #A5731E;
    --almond: #8B5E3C;
    --line: rgba(90,58,34,0.14);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    background:var(--cream);
    color:var(--brown);
    font-family:'Cairo', sans-serif;
    min-height:100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 8px 8px, rgba(200,145,46,0.10) 1.6px, transparent 1.6px);
    background-size: 26px 26px;
    display:flex;
    justify-content:center;
    padding: 48px 20px 64px;
  }

  .page{
    width:100%;
    max-width: 420px;
  }

  .brand{
    text-align:center;
    margin-bottom: 8px;
  }

  .brand img{
    width: 220px;
    max-width: 78%;
    height:auto;
    display:inline-block;
  }

  .tagline{
    text-align:center;
    font-size: 15px;
    color: var(--brown-soft);
    margin-top: 6px;
    margin-bottom: 40px;
    line-height:1.7;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap: 14px;
  }

  .link-card{
    display:flex;
    align-items:center;
    gap: 14px;
    background: #FFFDF9;
    border: 1px solid var(--line);
    border-bottom: 3px solid var(--gold);
    border-radius: 14px;
    padding: 16px 18px;
    text-decoration:none;
    color: var(--brown);
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .link-card:active{
    transform: scale(0.98);
  }

  .link-card:hover{
    border-bottom-color: var(--gold-deep);
    background: #FFFCF4;
  }

  .link-card.disabled{
    opacity: 0.55;
    border-bottom-color: var(--line);
    cursor: default;
    pointer-events: none;
  }

  .icon{
    width: 40px;
    height: 40px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 10px;
    background: var(--cream-deep);
  }

  .icon svg{ width:22px; height:22px; }

  .label-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .label{
    font-weight:600;
    font-size: 16px;
  }

  .sub{
    font-size: 12.5px;
    color: var(--almond);
  }

  .soon-tag{
    font-size: 11.5px;
    color: var(--gold-deep);
    background: rgba(200,145,46,0.14);
    padding: 3px 10px;
    border-radius: 999px;
    flex-shrink:0;
  }

  .arrow{
    color: var(--gold-deep);
    font-size: 18px;
    flex-shrink:0;
  }

  footer{
    text-align:center;
    margin-top: 44px;
    font-size: 12px;
    color: var(--almond);
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>

  <div class="page">
    <div class="brand">
      <img src="logo.jpg.jpeg" alt="ماما نوير">
    </div>
    <p class="tagline">كل روابطنا في مكان واحد</p>

    <div class="links" id="links"></div>

    <footer>ماما نويّر</footer>
  </div>

<script>
/* ============================================================
   لتعديل الروابط لاحقاً: غيّر القيم بالأسفل فقط ثم احفظ الملف.
   - url: ضع الرابط الكامل هنا (مثال: https://wa.me/9665xxxxxxxx)
   - active: اجعلها true بعد إضافة الرابط ليظهر الزر مفعّلاً،
             واتركها false ليظهر الزر باللون الخافت وكلمة "قريباً"
   ============================================================ */
const LINKS = [
  {
    key: 'store',
    label: 'المتجر الإلكتروني',
    sub: ' حيّاك في متجرنا ',
    url: 'https://ldhh.zid.store',
    active: true,
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#5A3A22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9z"/><path d="M9 13a3 3 0 0 0 6 0"/></svg>`
  },
  {
    key: 'whatsapp',
    label: 'واتساب',
    sub: 'تواصل معنا مباشرة',
    url: 'https://wa.me/966535148005',
    active: true,
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#5A3A22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 1 1-4.07-7.26"/><path d="M21 11.5c0 4.7-3.8 8.5-8.5 8.5a8.4 8.4 0 0 1-4.2-1.1L3 20l1.2-5a8.4 8.4 0 0 1-1.2-4.4"/></svg>`
  },
  {
    key: 'tiktok',
    label: 'تيك توك',
    sub: 'تابعنا وشاهد محتوانا',
    url: '',
    active: false,
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="#5A3A22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3v10.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M16 3c0 2.2 1.8 4 4 4"/></svg>`
  }
];

const container = document.getElementById('links');

LINKS.forEach(item => {
  const el = document.createElement(item.active ? 'a' : 'div');
  el.className = 'link-card' + (item.active ? '' : ' disabled');
  if (item.active) {
    el.href = item.url;
    el.target = '_blank';
    el.rel = 'noopener';
  }
  el.innerHTML = `
    <div class="icon">${item.icon}</div>
    <div class="label-wrap">
      <div class="label">${item.label}</div>
      <div class="sub">${item.sub}</div>
    </div>
    ${item.active ? '<span class="arrow">←</span>' : '<span class="soon-tag">قريباً</span>'}
  `;
  container.appendChild(el);
});
</script>

</body>
