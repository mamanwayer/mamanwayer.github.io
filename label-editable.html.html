<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ملصق فول ولوز - ماما نوير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  .helpbar{
    max-width:900px;
    margin:0 auto 14px;
    background:#fff3d6;
    border:2px dashed #b98a3e;
    border-radius:10px;
    padding:14px 18px;
    font-family:'Cairo',sans-serif;
    color:#4a2c1a;
    font-size:15px;
    line-height:1.7;
    text-align:right;
  }
  .helpbar b{ color:#2e1a10; }
  .downloadBtn{
    display:block;
    margin:0 auto 18px;
    background:#2e1a10;
    color:#fff;
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:16px;
    border:none;
    padding:12px 28px;
    border-radius:30px;
    cursor:pointer;
  }
  .downloadBtn:hover{ background:#4a2c1a; }
  [contenteditable="true"]{
    outline: 2px dashed transparent;
    border-radius:4px;
    transition: outline-color .15s;
    cursor:text;
  }
  [contenteditable="true"]:hover,
  [contenteditable="true"]:focus{
    outline-color:#2e86de;
    background:rgba(46,134,222,.08);
  }
  :root{
    --wood-dark:#3a2a1e;
    --wood-mid:#4a3526;
    --cream:#f3ead4;
    --cream2:#eee0bf;
    --brown:#4a2c1a;
    --brown-deep:#2e1a10;
    --gold:#b98a3e;
    --gold-light:#d9b26b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Cairo', sans-serif;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .stage{
    width:900px;
    height:900px;
    background:
      repeating-linear-gradient(90deg, var(--wood-mid) 0 6px, var(--wood-dark) 6px 14px);
    position:relative;
    border-radius:6px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .lid{
    position:absolute;
    inset:60px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 42%, #fbf7ec 0%, var(--cream) 55%, var(--cream2) 100%);
    box-shadow:
      0 0 0 6px #fff,
      0 0 0 10px #d8cba3,
      0 0 0 34px #fff,
      0 0 0 38px var(--brown),
      0 25px 50px rgba(0,0,0,.55);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:46px;
    overflow:hidden;
  }
  /* decorative gold border ring, just inside the brown ring */
  .lid::before{
    content:"";
    position:absolute;
    inset:14px;
    border-radius:50%;
    border:3px dashed var(--gold);
    opacity:.55;
    pointer-events:none;
  }
  .logo-badge{
    width:170px;
    height:170px;
    border-radius:50%;
    background:var(--cream);
    border:4px solid var(--brown);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    z-index:3;
  }
  .logo-badge .figure{
    width:56px;
    height:56px;
    margin-bottom:2px;
  }
  .logo-badge .brand{
    font-family:'Lalezar', 'Cairo', sans-serif;
    font-size:26px;
    color:var(--brown-deep);
    line-height:1;
  }
  .tagline{
    margin-top:6px;
    font-size:12px;
    font-weight:700;
    color:var(--brown-deep);
    letter-spacing:.3px;
  }
  .title{
    font-family:'Lalezar','Cairo',sans-serif;
    font-size:92px;
    color:var(--brown-deep);
    margin-top:8px;
    text-shadow:1px 1px 0 rgba(255,255,255,.3);
  }
  .ribbon{
    background:var(--brown-deep);
    color:#fff;
    font-weight:800;
    font-size:26px;
    padding:8px 34px;
    border-radius:4px;
    margin-top:2px;
    letter-spacing:.5px;
  }
  .cal-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:16px;
  }
  .cal-row .flame{ font-size:22px; margin-bottom:-4px;}
  .cal-row .num{
    font-family:'Lalezar','Cairo',sans-serif;
    font-size:44px;
    color:var(--brown-deep);
    line-height:1;
  }
  .cal-row .lbl{
    font-size:15px;
    font-weight:700;
    color:var(--brown-deep);
    text-align:center;
    line-height:1.3;
  }
  .side-art{
    position:absolute;
    bottom:130px;
    width:230px;
    opacity:.9;
  }
  .side-left{ left:60px; }
  .side-right{ right:50px; text-align:right;}
  .bottom-row{
    position:absolute;
    bottom:96px;
    left:0; right:0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:26px;
    z-index:3;
  }
  .qr-box{
    background:#fff;
    padding:6px;
    border-radius:6px;
    width:78px; height:78px;
  }
  .qr-box #qr{ width:100%; height:100%; }
  .contact{
    text-align:center;
  }
  .contact .num{
    font-size:20px;
    font-weight:800;
    color:var(--brown-deep);
    direction:ltr;
    display:inline-block;
  }
  .contact .lbl{
    font-size:13px;
    font-weight:700;
    color:var(--brown-deep);
    margin-top:2px;
  }
  .weight-badge{
    position:absolute;
    bottom:44px;
    left:50%;
    transform:translateX(50%);
    background:var(--brown-deep);
    color:#fff;
    font-weight:800;
    font-size:17px;
    padding:8px 26px;
    border-radius:22px;
    z-index:3;
  }
  svg{ display:block; }
</style>
</head>
<body>

<div class="helpbar">
  💡 <b>كيف تعدّل؟</b> اضغط بإصبعك أو الماوس على أي نص باللون الأصفر (لما تلمسه يطلع له إطار أزرق) واكتب بدلاه. لما تخلص، اضغط زر <b>"تحميل الصورة"</b> تحت.
</div>

<button class="downloadBtn" onclick="downloadImage()">⬇️ تحميل الصورة</button>

<div class="stage" id="stage">
  <div class="lid">

    <div class="logo-badge">
      <svg class="figure" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30" fill="#f3ead4"/>
        <path d="M32 10c-11 0-18 9-18 20 0 9 5 16 10 20h16c5-4 10-11 10-20 0-11-7-20-18-20z" fill="#2e1a10"/>
        <rect x="24" y="30" width="16" height="8" rx="4" fill="#f3ead4"/>
      </svg>
      <div class="brand" contenteditable="true">ماما نوير</div>
      <div class="tagline" style="font-size:9px;" contenteditable="true">شغل بيت وأيادي سعودية</div>
    </div>

    <div class="title" contenteditable="true">فول ولوز</div>
    <div class="ribbon" contenteditable="true">طبيعي 100%</div>

    <div class="cal-row">
      <div class="flame">🔥</div>
      <div class="num" contenteditable="true">610</div>
      <div class="lbl" contenteditable="true">سعرة حرارية<br>لكل 100 جرام</div>
    </div>

    <svg class="side-art side-left" viewBox="0 0 200 160">
      <polygon points="0,160 30,60 60,160" fill="#c9a24a" opacity=".35"/>
      <polygon points="20,160 60,40 100,160" fill="#c9a24a" opacity=".3"/>
      <g fill="#c9a24a" opacity=".55">
        <line x1="40" y1="130" x2="40" y2="90" stroke="#c9a24a" stroke-width="4"/>
        <path d="M40 90 C20 80,10 90,10 100 M40 90 C60 80,70 90,70 100 M40 90 C30 70,25 70,20 75 M40 90 C50 70,55 70,60 75" stroke="#c9a24a" stroke-width="3" fill="none"/>
      </g>
    </svg>

    <svg class="side-art side-right" viewBox="0 0 200 160">
      <g transform="translate(40,20)">
        <ellipse cx="70" cy="60" rx="22" ry="30" fill="#a9764a" transform="rotate(20 70 60)"/>
        <ellipse cx="100" cy="90" rx="20" ry="28" fill="#a9764a" transform="rotate(-10 100 90)"/>
        <ellipse cx="45" cy="100" rx="18" ry="24" fill="#a9764a" transform="rotate(35 45 100)"/>
        <circle cx="30" cy="60" r="9" fill="#d8c39a"/>
        <circle cx="45" cy="45" r="9" fill="#d8c39a"/>
        <circle cx="20" cy="80" r="9" fill="#d8c39a"/>
        <path d="M90 20 q20 -10 30 5 q-20 5 -30 -5z" fill="#4d7a3f"/>
      </g>
    </svg>

    <div class="bottom-row">
      <div class="contact">
        <div class="num" contenteditable="true">0507689004</div>
        <div class="lbl" contenteditable="true">📞 للتواصل</div>
      </div>
      <div class="qr-box"><div id="qr"></div></div>
    </div>

    <div class="weight-badge" contenteditable="true">الوزن : 150 جرام</div>

  </div>
</div>

<script>
  new QRCode(document.getElementById("qr"), {
    text: "tel:0507689004",
    width: 66,
    height: 66,
    colorDark: "#2e1a10",
    colorLight: "#ffffff"
  });

  function downloadImage(){
    html2canvas(document.getElementById("stage"), {scale:2, useCORS:true}).then(function(canvas){
      var link = document.createElement("a");
      link.download = "ملصق-فول-ولوز.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  }
</script>
</body>
</html>
